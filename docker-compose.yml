services:
  metabase:
    image: metabase/metabase:latest
    container_name: edutestpro-metabase
    ports:
      - "3001:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      MB_SQLITE_FILE: /data/dev.db
    volumes:
      - ./prisma:/data
      - metabase-data:/metabase-data
    restart: unless-stopped

volumes:
  metabase-data: